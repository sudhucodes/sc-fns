<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" fill="none">
  <style>
    .brand-text { fill: #09090b; }
    .brand-suffix { fill: #71717a; }
    @media (prefers-color-scheme: dark) {
      .brand-text { fill: #000; }
      .brand-suffix { fill: #000; }
    }
  </style>

  <!-- Icon Mark Badge -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="#09090b" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#27272a" stroke-width="1" />

  <!-- Monogram: sc} -->
  <text
    x="16"
    y="21"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="13"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-0.5px"
  >sc<tspan fill="#a1a1aa" font-weight="500">}</tspan></text>

  <!-- Wordmark: sc-fns -->
  <text
    x="42"
    y="22"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="700"
    letter-spacing="-0.03em"
    class="brand-text"
  >sc<tspan font-weight="500" class="brand-suffix">-fns</tspan></text>
</svg>
